name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            archive_ext: tar.gz
          - os: windows-latest
            rid: win-x64
            archive_ext: zip
          - os: macos-latest
            rid: osx-x64
            archive_ext: tar.gz
          - os: macos-latest
            rid: osx-arm64
            archive_ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained
        shell: bash
        run: |
          dotnet publish Quizz/src/Quizz/Quizz.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=embedded \
            -o publish

      - name: Archive (zip, Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* -DestinationPath Quizz-${{ github.ref_name }}-${{ matrix.rid }}.zip

      - name: Archive (tar.gz, Linux/macOS)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          tar -czf Quizz-${{ github.ref_name }}-${{ matrix.rid }}.tar.gz -C publish .

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: Quizz-${{ github.ref_name }}-${{ matrix.rid }}.${{ matrix.archive_ext }}
          generate_release_notes: true
          fail_on_unmatched_files: true
